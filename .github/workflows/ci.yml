# CI/CD for GoBlog.dev.
#
# On every push and pull request: lint, unit tests and MongoDB integration
# tests (the same checks as `make lint`, `make test-unit` and
# `make test-integration`), then a container image build.
#
# On pushes to main and on version tags (v1.2.3), the image is also
# published to GitHub Container Registry as ghcr.io/<owner>/<repo>, ready for
# any host to deploy.
#
# Version tags on main (git tag v1.2.3 && git push origin v1.2.3) are also
# deployed to Fly.io (fly.toml); pushes to main are not. That needs the
# FLY_API_TOKEN repository secret.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request cancels the older run; runs on main
# and tags always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  GOLANGCI_LINT_VERSION: v2.14.0 # keep in sync with the Makefile
  FLY_APP: goblog # keep in sync with fly.toml

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Go (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          # Build it with the project's Go, so it understands the go.mod version.
          install-mode: goinstall
          working-directory: backend

      - name: Frontend (ESLint + TypeScript)
        run: make lint-frontend

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Builds the frontend first: the Go tests render pages with it.
      - run: make test-unit

  integration:
    name: Integration tests (MongoDB)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: make test-integration
        env:
          MONGODB_TEST_URI: mongodb://localhost:27017

  image:
    name: Container image
    needs: [lint, test, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # to publish to ghcr.io
    outputs:
      deploy: ${{ steps.release.outputs.deploy }}
    env:
      # Publish on pushes to main and version tags; pull requests only build.
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A version tag needs main's history to check that it's on main.
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/v') && '0' || '1' }}

      # Deploy only version tags whose commit is on main. The image then also
      # goes to Fly's registry, for the deploy job.
      - name: Is this a release?
        id: release
        run: |
          deploy=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              deploy=true
            else
              echo "::warning::$GITHUB_REF_NAME isn't on main, so it won't be deployed."
            fi
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Fly.io registry
        if: steps.release.outputs.deploy == 'true'
        uses: docker/login-action@v4
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            registry.fly.io/${{ env.FLY_APP }},enable=${{ steps.release.outputs.deploy }}
          # main → :main and :latest; v1.2.3 → :1.2.3 and :1.2; every build → :sha-<commit>
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build${{ env.PUBLISH == 'true' && ' and publish' || '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Fly.io
    needs: [image]
    if: needs.image.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push waits rather than cancelling mid-rollout.
    concurrency: deploy-fly
    environment:
      name: production
      url: https://${{ env.FLY_APP }}.fly.dev
    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Deploys the image the image job built and tested, by its version
      # (v1.2.3 → :1.2.3), so Fly's release list shows which version is live.
      - run: flyctl deploy --ha=false --image registry.fly.io/${FLY_APP}:${GITHUB_REF_NAME#v}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
