# golangci-lint v2: the standard linter set (errcheck, govet, ineffassign,
# staticcheck, unused) plus gofmt/goimports formatting. Run with `make lint`.
version: "2"

linters:
  default: standard

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/michaelputong/blog
