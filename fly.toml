# fly.toml app configuration file generated for goblog on 2026-09-29T11:58:23Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'goblog'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # A deploy fails if the new machine doesn't pass this, instead of going live broken.
  [[http_service.checks]]
    method = 'GET'
    path = '/healthz'
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'

# Fly's smallest machine (shared-cpu-1x, 256 MB). It stops when idle (above),
# so it's only billed while serving requests.
[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
